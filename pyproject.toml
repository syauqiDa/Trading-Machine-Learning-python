[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xauusd-ict-ml"
version = "0.1.0"
description = "Leakage-aware XAUUSD ICT-style research and paper-trading toolkit"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Research Project"}]
dependencies = [
  "pandas>=2.1",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "pydantic>=2.5",
  "PyYAML>=6.0",
  "matplotlib>=3.8",
  "joblib>=1.3",
  "pyarrow>=14.0",
]

[project.optional-dependencies]
boosting = ["xgboost>=2.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
xauusd-ict-ml = "xauusd_ict_ml.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
filterwarnings = ["error", "ignore:.*timezone.*:FutureWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
